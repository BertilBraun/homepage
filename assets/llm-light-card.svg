<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">LLM-Light artifact resolution</title>
  <desc id="description">Four complete experiment configurations resolve to one shared pretraining artifact, two post-training artifacts, and four evaluation artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#17766c"/>
    </marker>
    <style>
      .label { font: 700 24px Inter, 'Segoe UI', Arial, sans-serif; fill: #18201e; text-anchor: middle; }
      .small { font: 650 20px Inter, 'Segoe UI', Arial, sans-serif; fill: #18201e; text-anchor: middle; }
      .count { font: 700 18px Inter, 'Segoe UI', Arial, sans-serif; letter-spacing: 1.5px; fill: #17766c; text-anchor: start; }
      .config { fill: #ffffff; stroke: #c8cfcb; stroke-width: 2; }
      .shared { fill: #dcefeb; stroke: #17766c; stroke-width: 2.5; }
      .branch { fill: #edf6f3; stroke: #70a99f; stroke-width: 2; }
      .eval { fill: #ffffff; stroke: #8a9590; stroke-width: 2; }
      .connector { fill: none; stroke: #8aa9a2; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #17766c; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="count" x="28" y="72">4 CONFIGS</text>
  <rect class="config" x="228" y="30" width="128" height="70" rx="12"/>
  <rect class="config" x="380" y="30" width="128" height="70" rx="12"/>
  <rect class="config" x="532" y="30" width="128" height="70" rx="12"/>
  <rect class="config" x="684" y="30" width="128" height="70" rx="12"/>
  <text class="label" x="292" y="74">A1</text>
  <text class="label" x="444" y="74">A2</text>
  <text class="label" x="596" y="74">B1</text>
  <text class="label" x="748" y="74">B2</text>

  <path class="connector" d="M292 101 V128 M444 101 V128 M596 101 V128 M748 101 V128 M292 128 H748"/>
  <path class="flow" d="M520 128 V154"/>

  <text class="count" x="28" y="210">1 SHARED</text>
  <rect class="shared" x="355" y="160" width="330" height="92" rx="14"/>
  <text class="label" x="520" y="198">Pretraining</text>
  <text class="small" x="520" y="229">one compatible artifact</text>

  <path class="connector" d="M520 253 V280 M380 280 H660"/>
  <path class="flow" d="M380 280 V304"/>
  <path class="flow" d="M660 280 V304"/>

  <text class="count" x="28" y="354">2 BRANCHES</text>
  <rect class="branch" x="260" y="310" width="240" height="78" rx="14"/>
  <rect class="branch" x="540" y="310" width="240" height="78" rx="14"/>
  <text class="label" x="380" y="358">Post-train A</text>
  <text class="label" x="660" y="358">Post-train B</text>

  <path class="connector" d="M380 389 V410 M295 410 H445 M660 389 V410 M595 410 H745"/>
  <path class="flow" d="M295 410 V456"/>
  <path class="flow" d="M445 410 V456"/>
  <path class="flow" d="M595 410 V456"/>
  <path class="flow" d="M745 410 V456"/>

  <text class="count" x="28" y="507">4 RESULTS</text>
  <rect class="eval" x="230" y="464" width="130" height="60" rx="12"/>
  <rect class="eval" x="380" y="464" width="130" height="60" rx="12"/>
  <rect class="eval" x="530" y="464" width="130" height="60" rx="12"/>
  <rect class="eval" x="680" y="464" width="130" height="60" rx="12"/>
  <text class="small" x="295" y="502">Eval A1</text>
  <text class="small" x="445" y="502">Eval A2</text>
  <text class="small" x="595" y="502">Eval B1</text>
  <text class="small" x="745" y="502">Eval B2</text>
</svg>
