<svg xmlns="http://www.w3.org/2000/svg" width="700" height="850" viewBox="0 0 700 850" role="img" aria-labelledby="title description">
  <title id="title">Voice-Light research and deployment pipeline</title>
  <desc id="description">Tool-use data and turn-taking data feed separate language and causal interaction training branches, which join in a hybrid streaming runtime and live browser agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L10 5.5 L0 11 Z" fill="#68736f"/>
    </marker>
    <style>
      .label { font: 700 25px Inter, 'Segoe UI', Arial, sans-serif; fill: #17201d; text-anchor: middle; }
      .detail { font: 400 18px Inter, 'Segoe UI', Arial, sans-serif; fill: #63706a; text-anchor: middle; }
      .inverse { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #c9d0cc; stroke-width: 2.5; }
      .soft { fill: #e7f3f0; stroke: #218274; stroke-width: 2.5; }
      .live { fill: #176f65; stroke: #176f65; stroke-width: 2.5; }
      .flow { fill: none; stroke: #68736f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="40" y="30" width="285" height="116" rx="15"/>
  <text class="label" x="182" y="78">Tool-use data</text>
  <text class="detail" x="182" y="110">3,999 synthetic</text>
  <text class="detail" x="182" y="133">conversations</text>

  <rect class="box" x="375" y="30" width="285" height="116" rx="15"/>
  <text class="label" x="518" y="78">Turn-taking data</text>
  <text class="detail" x="518" y="110">synthetic + human</text>
  <text class="detail" x="518" y="133">conversation evidence</text>

  <path class="flow" d="M182 147 V220"/>
  <path class="flow" d="M518 147 L455 220"/>
  <path class="flow" d="M518 147 L590 220"/>

  <rect class="soft" x="40" y="225" width="285" height="116" rx="15"/>
  <text class="label" x="182" y="273">Language adapter</text>
  <text class="detail" x="182" y="305">spoken tool protocol</text>
  <text class="detail" x="182" y="328">training</text>

  <rect class="soft" x="352" y="225" width="146" height="116" rx="15"/>
  <text class="label" x="425" y="272">Synthetic</text>
  <text class="label" x="425" y="301">audio</text>
  <text class="detail" x="425" y="328">causal labels</text>

  <rect class="soft" x="514" y="225" width="146" height="116" rx="15"/>
  <text class="label" x="587" y="272">Human</text>
  <text class="label" x="587" y="301">audio</text>
  <text class="detail" x="587" y="328">locked splits</text>

  <path class="flow" d="M425 342 L454 424"/>
  <path class="flow" d="M587 342 L500 424"/>
  <path class="flow" d="M182 342 L382 424"/>

  <rect class="box" x="105" y="430" width="490" height="124" rx="15"/>
  <text class="label" x="350" y="478">Two focused adapters</text>
  <text class="detail" x="350" y="512">tool use + causal interaction evidence</text>
  <text class="detail" x="350" y="538">evaluated separately before deployment</text>

  <path class="flow" d="M350 555 V624"/>

  <rect class="soft" x="105" y="630" width="490" height="100" rx="15"/>
  <text class="label" x="350" y="676">Hybrid streaming runtime</text>
  <text class="detail" x="350" y="708">ASR · learned evidence · tools · TTS</text>

  <path class="flow" d="M350 731 V770"/>

  <rect class="live" x="105" y="776" width="490" height="70" rx="15"/>
  <circle cx="138" cy="811" r="7" fill="#a8dfd5"/>
  <text class="label inverse" x="365" y="820">Live full-duplex browser agent</text>
</svg>
