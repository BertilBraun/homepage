<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="Spoken tool-use turn: the model speaks a natural bridge, emits a structured call, uses the result, and continues; and a second path where no tool is called. Holdout scores before and after fine-tuning.">
