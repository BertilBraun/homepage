<text x="26.0" y="54.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#6a7180" text-anchor="start">What the adapter had to learn: say something natural first, call the tool correctly, use the result — and stay quiet when no tool is needed.</text>
